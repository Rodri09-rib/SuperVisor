
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-supervisor}
      POSTGRES_USER: ${DB_USERNAME:-supervisor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: