spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/supervisor
    username: supervisor
    password: supervisor
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
api:
  security:
    token:
      # Segredo de assinatura do JWT. OBRIGATORIO e SEM valor por omissao, de
      # proposito: a aplicacao deve recusar arrancar em vez de assinar tokens com
      # uma chave previsivel. Definir como variavel de ambiente (ver .env.example).
      # Os testes nao dependem deste valor - a propriedade e sobrescrita em
      # PostgresTestContainer.registerProperties.
      secret: ${JWT_SECRET}
