<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperVisor - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            /* O azul da aplicação é o primário do Bootstrap; o gradiente da
               coluna do mascote nasce dele e aprofunda-se até ao azul-marinho,
               para o tom trabalhar com a camisa do mascote. */
            --sv-azul: #0d6efd;
            --sv-azul-escuro: #031633;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
        }

        /* Coluna esquerda: o palco do mascote. O gradiente desce do azul da
           aplicação para o azul-marinho, com dois focos de luz difusa para o
           fundo não ficar chapado contra a camisa do mascote. */
        .painel-mascote {
            background:
                radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.10), transparent 38%),
                radial-gradient(circle at 82% 88%, rgba(255, 255, 255, 0.07), transparent 34%),
                linear-gradient(165deg, #0a58ca 0%, #0a4fbc 30%, #06327e 62%, var(--sv-azul-escuro) 100%);
        }

        .imagem-mascote {
            max-height: 62%;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 1.5rem 2.5rem rgba(0, 0, 0, 0.35));
        }

        .cartao-login {
            border: 0;
            border-radius: 1rem; /* rounded-4 */
            box-shadow: 0 1rem 2.5rem rgba(13, 110, 253, 0.12);
        }

        .cartao-login .form-control,
        .cartao-login .form-floating > .form-control {
            border-radius: 0.6rem;
        }

        /* O botão inteiro, e não só a cor: levanta-se um pouco com o cursor
           por cima e ganha uma sombra da sua própria cor. */
        .btn-entrar:hover,
        .btn-entrar:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1.25rem rgba(13, 110, 253, 0.4);
        }

        .btn-entrar {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .creditos {
            font-size: 0.8rem;
        }
    </style>
</head>
<body class="bg-light m-0">

<div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">

        <!-- Coluna do mascote: visível só em desktop para o ecrã pequeno ficar
             com o formulário a ocupar tudo. -->
        <div class="col-lg-6 painel-mascote d-none d-lg-flex flex-column
             align-items-center justify-content-center text-center text-white px-5 py-5">

            <div class="mb-3">
                <h2 class="fw-bold mb-1">Bem-vindo ao SuperVisor</h2>
                <p class="lead mb-0 opacity-75">Gestão inteligente de escalas</p>
            </div>

            <img src="/images/mascote-supervisor.png" alt="Mascote do SuperVisor"
                 class="imagem-mascote img-fluid">

            <p class="small opacity-75 mb-0 mt-4">
                Feito pelo SAC, para o SAC.
            </p>
        </div>

        <!-- Coluna do formulário. Flex em coluna para o cartão ficar centrado
             e os créditos ancorados ao fundo, os dois dentro da mesma coluna. -->
        <div class="col-lg-6 d-flex flex-column position-relative bg-light">
            <div class="flex-grow-1 d-flex align-items-center justify-content-center p-3 p-md-5">
                <div class="w-100" style="max-width: 26rem;">
                    <div class="card cartao-login">
                        <div class="card-body p-4 p-md-5 pt-4">

                            <div class="text-center mb-4">
                                <h2 class="fw-bold text-primary mb-1">SuperVisor</h2>
                                <p class="text-muted mb-0">Feito pelo SAC, para o SAC.</p>
                            </div>

                            <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

                            <form id="loginForm">
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control form-control-lg"
                                           id="email" placeholder="nome@exemplo.com" required>
                                    <label for="email">E-mail</label>
                                </div>
                                <div class="form-floating mb-4">
                                    <input type="password" class="form-control form-control-lg"
                                           id="password" placeholder="Senha" required>
                                    <label for="password">Senha</label>
                                </div>
                                <button type="submit"
                                        class="btn btn-primary btn-entrar w-100 btn-lg fw-bold">
                                    Entrar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center pb-3 creditos text-muted">
                Desenvolvido por:
                <a href="https://github.com/Rodri09-rib" target="_blank" rel="noopener noreferrer"
                   class="text-decoration-none">RodriRib</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMessage');
        const submitBtn = this.querySelector('button[type="submit"]');

        errorDiv.classList.add('d-none');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Aguarde...';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                const token = await response.text();
                localStorage.setItem('jwt_token', token);
                window.location.href = '/dashboard';
            } else {
                errorDiv.textContent = 'E-mail ou senha incorretos.';
                errorDiv.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar';
            }
        } catch (error) {
            errorDiv.textContent = 'Erro ao comunicar com o servidor. Tente novamente.';
            errorDiv.classList.remove('d-none');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Entrar';
        }
    });
</script>
</body>
</html>
