<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperVisor - Folgas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
        .modal-dialog-scrollable .modal-content {
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        .modal-dialog-scrollable .modal-body {
            overflow-y: auto !important;
            max-height: calc(85vh - 130px);
        }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar('leaves')}"></div>

<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer" aria-live="polite"></div>

<div class="container mt-4 mb-5">

    <div class="row mb-4">
        <div class="col-12 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div>
                <h3 class="fw-bold text-secondary mb-0">
                    <i class="bi bi-calendar-x"></i> Folgas
                </h3>
                <p class="text-muted small mb-0 mt-1">
                    Quem está de folga é informação de toda a equipe, por isso a
                    lista mostra todas.
                </p>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <select id="filtroUtilizador" class="form-select form-select-sm" style="width: auto;">
                    <option value="">Toda a equipe</option>
                </select>
                <button type="button" class="btn btn-primary btn-sm d-none" id="btnNovaFolga">
                    <i class="bi bi-plus-lg"></i> Registrar folga
                </button>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Pessoa</th>
                        <th scope="col">De</th>
                        <th scope="col">Até</th>
                        <th scope="col">Duração</th>
                        <th scope="col">Motivo</th>
                        <th scope="col" class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody id="folgasCorpo">
                    <tr>
                        <td colspan="6" class="text-center py-5 text-muted">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Carregando folgas...</span>
                            </div>
                            <div class="mt-2">Carregando folgas...</div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal: registrar e editar -->
<div class="modal fade" id="folgaModal" tabindex="-1" aria-labelledby="folgaTitulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <form id="folgaForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="folgaModalTitulo">Nova folga</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
                    <div id="folgaAviso" class="alert d-none" role="alert"></div>
                    <input type="hidden" id="folgaId">

                    <div class="mb-3">
                        <label for="folgaUtilizador" class="form-label fw-semibold">
                            Pessoa <span class="text-danger">*</span>
                        </label>
                        <select id="folgaUtilizador" class="form-select"></select>
                        <div class="form-text" id="folgaUtilizadorAjuda"></div>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="folgaInicio" class="form-label fw-semibold">
                                De <span class="text-danger">*</span>
                            </label>
                            <input type="date" id="folgaInicio" class="form-control">
                        </div>
                        <div class="col-6 mb-3">
                            <label for="folgaFim" class="form-label fw-semibold">
                                Até <span class="text-danger">*</span>
                            </label>
                            <input type="date" id="folgaFim" class="form-control">
                        </div>
                    </div>

                    <div class="mb-0">
                        <label for="folgaMotivo" class="form-label fw-semibold">Motivo</label>
                        <textarea id="folgaMotivo" class="form-control" rows="2" maxlength="500"
                                  placeholder="Opcional."></textarea>
                        <div class="form-text">Até 500 caracteres. Fica vazio se não for preenchido.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSubmeterFolga">
                        <i class="bi bi-check-lg"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal: apagar -->
<div class="modal fade" id="apagarModal" tabindex="-1" aria-labelledby="apagarTitulo" aria-hidden="true">
<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title" id="apagarTitulo">Remover folga</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
</div>
<div class="modal-body">
                <p class="mb-0" id="apagarTexto"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" id="btnConfirmarApagar">
                    <i class="bi bi-trash"></i> Remover
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/format.js}"></script>
<script th:src="@{/js/layout.js}"></script>
<script th:src="@{/js/leaves.js}"></script>
</body>
</html>
